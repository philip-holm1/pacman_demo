[project]
name = "pacman-demo"
version = "0.1.0"
description = "Modern powerups Pacman demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame~=2.5",
  "pytest~=8.2"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
